<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillBridge</title>
<style>
:root{--navy:#10213d;--blue:#2857d9;--sky:#eaf0ff;--ink:#17243b;--muted:#69758b;--bg:#f5f7fb;--line:#e4e9f2}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:10px 13px;font-weight:700}.primary{background:var(--blue);color:white}.soft{background:var(--sky);color:var(--blue)}header{background:var(--navy);color:white;padding:16px max(16px,calc((100% - 1050px)/2));position:sticky;top:0;z-index:2}.brand{font-size:22px;font-weight:850}.brand span{color:#8eb1ff}nav{display:flex;gap:6px;overflow:auto;margin-top:12px}nav button{white-space:nowrap;background:transparent;color:#dce6ff}nav button.active{background:#2a416b}main{max-width:1050px;margin:auto;padding:22px 15px 50px}.hero{border-radius:22px;padding:25px;color:white;background:linear-gradient(125deg,#17366f,#2e5de0);display:grid;grid-template-columns:1.4fr .7fr;gap:20px}.hero h1{font-size:clamp(30px,5vw,42px);line-height:1.08;margin:12px 0}.hero p{line-height:1.6;color:#dbe5ff}.hero-art{background:#ffffff18;border:1px solid #ffffff35;border-radius:17px;padding:18px;display:flex;flex-direction:column;justify-content:space-between}.hero-art .emoji{font-size:44px}.hero-art strong{font-size:22px}.section{margin-top:25px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.head h2{font-size:21px;margin:0}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:17px;margin-bottom:12px}.stat{display:flex;align-items:center;gap:12px}.ico{font-size:23px;background:var(--sky);border-radius:13px;padding:11px}.stat strong{font-size:25px;display:block}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.course{display:flex;align-items:start;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.course:last-child{border:0}.course .emoji{font-size:23px;background:#f0f4ff;border-radius:12px;padding:10px}.course-body{flex:1}.course h3,.opp h3{font-size:15px;margin:0 0 5px}.course p,.opp p{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 9px}.progress{height:7px;background:#edf0f6;border-radius:8px;margin-top:8px;overflow:hidden}.progress span{display:block;height:100%;background:var(--blue)}.pill{font-size:11px;background:#edf1ff;color:var(--blue);padding:5px 9px;border-radius:20px;font-weight:800}.opp{background:white;border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:10px}.opphead{display:flex;justify-content:space-between;gap:10px}.filters{display:flex;gap:8px;margin-bottom:14px}.filters input{flex:1}.filters input,.filters select,.field input,.field select{min-width:0;width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:white}.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.notice{margin-top:16px;background:#fff8e9;border:1px solid #f3e1bd;border-radius:12px;padding:12px;color:#805314;font-size:12px;line-height:1.5}footer{text-align:center;padding:20px;color:var(--muted);font-size:12px}
@media(max-width:650px){.hero{grid-template-columns:1fr;padding:20px}.hero-art{min-height:130px}.grid,.two{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}.filters{flex-direction:column}header{padding:14px}}
</style></head><body>
<header><div class="brand">Skill<span>Bridge</span></div><div style="font-size:11px;color:#c3d2f1">LEARN. GROW. GET HIRED.</div><nav><button class="active" data-view="dashboard">Dashboard</button><button data-view="roadmap">My roadmap</button><button data-view="opportunities">Opportunities</button><button data-view="profile">My profile</button></nav></header><main id="app"></main><footer>SkillBridge student demo • Opportunities shown here are samples, not live vacancies.</footer>
<script>
const S={name:localStorage.sbname||"Student",goal:localStorage.sbgoal||"Frontend Developer",skills:JSON.parse(localStorage.sbskills||'["HTML & CSS","JavaScript"]'),done:JSON.parse(localStorage.sbdone||'[true,false,false,false]'),view:"dashboard",q:"",filter:"All"};
const C=[["🎨","HTML & CSS Foundations","Build accessible, responsive pages.","3 hours"],["⚡","JavaScript Essentials","Learn variables, functions, and events.","6 hours"],["⚛️","React Fundamentals","Create reusable UI components.","5 hours"],["🧩","Build a Portfolio Project","Build a project you can show.","1 week"]];
const O=[["Frontend Developer Intern","Internship","HTML, CSS, JavaScript","Practice building accessible, responsive pages."],["Junior Web Project Challenge","Project","React, UI design","Build a small dashboard and explain your design."],["Full-stack Learning Sprint","Learning","Node.js, APIs, databases","Create a simple API and connect it to a web interface."],["Student Portfolio Review","Mentorship","Git, portfolio, communication","Prepare a portfolio and practice explaining your work."]];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.sbname=S.name;localStorage.sbgoal=S.goal;localStorage.sbskills=JSON.stringify(S.skills);localStorage.sbdone=JSON.stringify(S.done)}function percent(){return Math.round(S.done.filter(Boolean).length/4*100)}
function course(c,i){return `<div class="course"><div class="emoji">${c[0]}</div><div class="course-body"><h3>${c[1]}</h3><p>${c[2]} · ${c[3]}</p><div class="progress"><span style="width:${S.done[i]?100:i===1?25:0}%"></span></div></div><button class="soft" onclick="toggle(${i})">${S.done[i]?"Done":"Mark done"}</button></div>`}
function dashboard(){return `<section class="hero"><div><div style="font-size:11px;letter-spacing:1.5px;font-weight:800;color:#bdd0ff">YOUR NEXT STEP STARTS HERE</div><h1>Build skills.<br>Build your future.</h1><p>Welcome back, ${esc(S.name)}. Follow your learning roadmap, track progress, and prepare for opportunities that match your goals.</p><button style="background:white;color:#17366f" onclick="view('roadmap')">Continue learning →</button> <button class="soft" onclick="view('opportunities')">Explore opportunities</button></div><div class="hero-art"><div class="emoji">🚀</div><div><small>YOUR CAREER GOAL</small><br><strong>${esc(S.goal)}</strong></div></div></section><section class="section"><div class="head"><h2>Your progress</h2><span class="pill">${percent()}% roadmap complete</span></div><div class="grid"><div class="card stat"><div class="ico">📚</div><div><strong>${S.done.filter(Boolean).length}</strong><span class="muted">Steps completed</span></div></div><div class="card stat"><div class="ico">💡</div><div><strong>${S.skills.length}</strong><span class="muted">Skills tracked</span></div></div><div class="card stat"><div class="ico">🎯</div><div><strong>${O.length}</strong><span class="muted">Practice activities</span></div></div></div></section><div class="two"><section class="section"><div class="head"><h2>Learning roadmap</h2><button class="soft" onclick="view('roadmap')">View all</button></div><div class="card">${C.slice(0,3).map(course).join("")}</div></section><section class="section"><div class="head"><h2>Suggested next steps</h2></div><div class="card"><h3>🛠️ Build a mini project</h3><p class="muted">Create a portfolio page that demonstrates your current skills.</p><button class="soft" onclick="view('roadmap')">Open roadmap</button><hr style="border:0;border-top:1px solid #e4e9f2;margin:18px 0"><h3>🧑‍💻 Prepare your profile</h3><p class="muted">Add your career goal and skills.</p><button class="soft" onclick="view('profile')">Edit profile</button></div></section></div><div class="notice"><b>Demo only:</b> Your profile and progress are saved in this browser on this device. There is no online login or shared database yet.</div>`}
function roadmap(){return `<section class="section"><div class="head"><h2>My learning roadmap</h2><span class="pill">${percent()}% complete</span></div><div class="card">${C.map(course).join("")}</div><div class="notice">Tip: try a small project after each topic. Mark a step done when you've practiced it.</div></section>`}
function opportunities(){let list=O.filter(o=>(S.filter==="All"||o[1]===S.filter)&&o.join(" ").toLowerCase().includes(S.q.toLowerCase()));return `<section class="section"><div class="head"><h2>Explore opportunities</h2><p class="muted">Sample activities to gain experience.</p></div><div class="filters"><input placeholder="Search titles or skills…" value="${esc(S.q)}" oninput="S.q=this.value;render()"><select onchange="S.filter=this.value;render()">${["All","Internship","Project","Learning","Mentorship"].map(x=>`<option ${S.filter===x?"selected":""}>${x}</option>`).join("")}</select></div>${list.length?list.map(o=>`<div class="opp"><div class="opphead"><h3>${o[0]}</h3><span class="pill">${o[1]}</span></div><p>${o[3]}</p><p><b>Skills:</b> ${o[2]}</p></div>`).join(""):'<div class="card">No matching sample activities.</div>'}<div class="notice">These are not verified vacancies. Check providers directly before sharing personal information.</div></section>`}
function profile(){return `<section class="section"><div class="head"><h2>My profile</h2></div><div class="card"><form onsubmit="profileSave(event)"><div class="field"><label>Your name</label><input id="name" required maxlength="60" value="${esc(S.name)}"></div><div class="field"><label>Career goal</label><select id="goal">${["Frontend Developer","Full-stack Developer","UI/UX Designer","Data Analyst","Mobile App Developer","Not sure yet"].map(x=>`<option ${S.goal===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>Skills (separate with commas)</label><input id="skills" value="${esc(S.skills.join(", "))}"></div><button class="primary">Save profile</button></form></div><div class="notice">Do not enter passwords or sensitive personal information in this demo.</div></section>`}
function view(v){S.view=v;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===v));render();scrollTo(0,0)}function render(){document.getElementById("app").innerHTML=S.view==="dashboard"?dashboard():S.view==="roadmap"?roadmap():S.view==="opportunities"?opportunities():profile()}function toggle(i){S.done[i]=!S.done[i];save();render()}function profileSave(e){e.preventDefault();S.name=document.getElementById("name").value.trim()||"Student";S.goal=document.getElementById("goal").value;S.skills=document.getElementById("skills").value.split(",").map(x=>x.trim()).filter(Boolean);save();render();alert("Profile saved on this device.")}document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>view(b.dataset.view));render();
</script></body></html>
